    <h1>Willkommen<br><em>zurück.</em></h1>

      <svg class="lucide-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="5"/><path d="M2 21a8 8 0 0 1 12.87-6.35M19 11v6M19 13h2M19 17a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/></svg>
